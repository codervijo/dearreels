[content]
# Declarative content identity for this site.
# Authored by the human; consumed by rankmill to generate drafts and run audits.
# Leave fields empty until you have a deliberate answer. Empty is better than wrong.
site_type = "b2c"
primary_keyword = "questions to ask my mother"
secondary_keywords = [
    "ways to stay close to parents far away",
    "how to feel closer to parents far away",
    "long distance grandparenting",
    "Mother's Day gifts that mean something",
    "milestone birthday gifts for Indian father turning 70",
]
icp = "The primary buyer is the eldest adult daughter in an NRI (non-resident Indian) family, aged 32-48, with stable household income above $80K (or local equivalent), one or two young children of her own, and parents aged 65+ still living in India. She speaks to her mother weekly but the calls have flattened into logistics — health updates, weather, what was cooked. She wants something deeper but doesn't know how to engineer it without it feeling forced. She has 2-3 siblings scattered across countries. She is the one who organizes family things, sends the birthday flowers, manages the WhatsApp group, and carries the quiet guilt of being far away. She does not search for \"memoir services\" — she searches for \"questions to ask my mother,\" \"how to feel closer to parents far away,\" and \"Mother's Day gifts that mean something.\" She buys for her mother but the product secretly serves her too."
urgency_trigger = "Parents are aging and distance is widening — take small, regular actions now to keep the relationship close."
penalty = "Relationships drift into logistical, surface-level interactions; you lose ongoing closeness, small moments, and face growing guilt and emotional distance."
tone = "restrained, literary, essayistic"
law = ""                  # statute or regulation if applicable, else empty
